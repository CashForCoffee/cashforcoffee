<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e9e2">
<title>CashForCoffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#e8e9e2;--paper:#f8f6ef;--ink:#172433;--muted:#657079;--faint:#918c7d;--line:#d5d2c4;--line2:#e7e3d7;--teal:#2d6d63;--teal-soft:#dce8e2;--rust:#b5533c;--rust-soft:#f2ded7;--brass:#b99932;--shadow:0 10px 28px rgba(23,36,51,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}button,input,select,textarea{font:inherit}.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.display{font-family:'Fraunces',serif}.hidden{display:none!important}
button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.topbar{position:sticky;top:0;z-index:20;background:rgba(232,233,226,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:18px 16px 14px}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}h1{font-size:27px;line-height:1.05;margin:3px 0 0}.iconbtn,.primary,.secondary,.danger{border-radius:9px;padding:10px 13px;font-weight:600;border:1px solid transparent}.iconbtn{background:var(--ink);color:white}.primary{background:var(--ink);color:white}.secondary{background:transparent;border-color:var(--line);color:var(--ink)}.danger{background:var(--rust);color:white}.primary:disabled,.danger:disabled{opacity:.35;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px}.summary-card{background:var(--paper);padding:14px}.summary-card.expected{background:#dad7ad}.summary-label{text-transform:uppercase;letter-spacing:.055em;font-size:10px;color:var(--muted);font-weight:600}.summary-value{font-size:21px;font-weight:600;margin-top:5px}.period-title{font-size:15px;margin:10px 16px 0;color:var(--muted)}
.section{margin:22px 16px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:9px}.section-title{text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--faint);font-weight:600}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(23,36,51,.035)}
.forecast-row{display:grid;grid-template-columns:126px 1fr 78px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12px}.forecast-row:last-child{border-bottom:0}.forecast-date{color:var(--muted)}.bar-zone{height:16px;position:relative;border-left:1px solid #b7b9b3}.bar{position:absolute;top:2px;height:12px;background:#236985;min-width:2px}.bar.negative{right:50%;background:var(--rust)}.forecast-amount{text-align:right;font-weight:600}.negative-text{color:var(--rust)}
.controls{display:flex;gap:8px;margin-bottom:10px}.search{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.filter{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 8px;max-width:125px}.item-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line2)}.item-row:last-child{border-bottom:0}.item-row:active{background:var(--line2)}.check{width:23px;height:23px;border-radius:7px;border:1.5px solid #b9b5a6;background:transparent;display:grid;place-items:center;color:white;padding:0}.check.paid{background:var(--teal);border-color:var(--teal)}.item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-name.paid{text-decoration:line-through;color:var(--faint)}.item-meta{font-size:10.5px;color:var(--faint);margin-top:2px}.amount{text-align:right;font-size:13.5px;font-weight:600}.income{color:var(--teal)}.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:white;font-size:28px;box-shadow:var(--shadow);z-index:15}.backdrop{position:fixed;inset:0;background:rgba(23,36,51,.54);z-index:50;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:94vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet-title{font-size:21px;font-weight:600}.close{border:0;background:none;font-size:20px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:16px}.tab{border:1px solid var(--line);background:transparent;border-radius:20px;padding:8px 12px;white-space:nowrap;font-size:12px}.tab.active{background:var(--ink);border-color:var(--ink);color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:12px}.field label{display:block;text-transform:uppercase;letter-spacing:.055em;font-size:10px;color:var(--faint);font-weight:600;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #c8c3b4;border-radius:9px;padding:10px}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.help{font-size:12px;color:var(--muted);line-height:1.5}.warning{background:var(--rust-soft);border:1px solid #ddb1a3;border-radius:10px;padding:11px;font-size:12px;color:#7c3525;margin:12px 0}.preview{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px;margin:12px 0;font-size:12px;line-height:1.6}.toast{position:fixed;z-index:100;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:white;border-radius:20px;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:.96}.loading{padding:70px 20px;text-align:center;color:var(--muted)}
@media(min-width:600px){.summary{grid-template-columns:repeat(4,1fr)}.summary-card{padding:16px}.grid-wide{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fab{bottom:28px}}
</style>
</head>
<body>
<div id="app" class="app"><div class="loading">Opening the ledger…</div></div>
<button id="fab" class="fab hidden" aria-label="Add item">+</button>
<div id="modal"></div><div id="toast" class="toast"></div>
<script>
/* Paste these from Supabase: Project Settings > API */
const SUPABASE_URL = 'https://iadncppgdpdiucrhdbxw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Yc5UXSbMl1L_rdY6LWd81A_K36QaZ62';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DAY=86400000,FORTNIGHT=14*DAY;
let state={items:[],settings:null,selectedPeriod:null,search:'',filter:'all',modal:null,tab:'item',editing:null,importParsed:null,busy:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const shortDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fullDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function fail(error,context='Something went wrong'){console.error(error);alert(`${context}. ${error?.message||''}`.trim())}
function signed(i){return i.type==='Income'?Number(i.amount):-Number(i.amount)}
function isoLocal(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

async function loadAll(){
 const [{data:items,error:e1},{data:settings,error:e2}]=await Promise.all([
  sb.from('budget_items').select('*').order('date').order('created_at'),
  sb.from('budget_settings').select('*').eq('id','global').single()
 ]);
 if(e1||e2){fail(e1||e2,'Could not load CashForCoffee');return}
 state.items=(items||[]).map(i=>({...i,amount:Number(i.amount)}));state.settings={...settings,starting_balance:Number(settings.starting_balance)};render();
}
function periods(){
 if(!state.settings)return[];const a=new Date(state.settings.anchor+'T00:00:00').getTime();
 const count=Number(state.settings.forecast_periods)||26;const nowIdx=Math.floor((Date.now()-a)/FORTNIGHT);const first=Math.min(nowIdx,0);const last=Math.max(nowIdx+count-1,0);
 let running=Number(state.settings.starting_balance)||0;const out=[];
 for(let idx=first;idx<=last;idx++){
  const start=a+idx*FORTNIGHT,end=start+FORTNIGHT;const its=state.items.filter(i=>{const t=new Date(i.date+'T00:00:00').getTime();return t>=start&&t<end});
  const income=its.filter(i=>i.type==='Income').reduce((s,i)=>s+Number(i.amount),0);const expenses=its.filter(i=>i.type!=='Income').reduce((s,i)=>s+Number(i.amount),0);running+=income-expenses;
  out.push({idx,start:isoLocal(new Date(start)),end:isoLocal(new Date(end-DAY)),items:its,income,expenses,net:income-expenses,balance:running});
 }
 return out;
}
function currentIdx(){const a=new Date(state.settings.anchor+'T00:00:00').getTime();return Math.floor((Date.now()-a)/FORTNIGHT)}
function currentPeriod(ps){const idx=state.selectedPeriod??currentIdx();return ps.find(p=>p.idx===idx)||ps[0]}
function periodLabel(p){return `${shortDate(p.start)} – ${fullDate(p.end)}`}
function forecastHTML(ps,selected){
 const shown=ps.filter(p=>p.idx>=currentIdx()).slice(0,Number(state.settings.forecast_periods)||26);const max=Math.max(1,...shown.map(p=>Math.abs(p.balance)));
 return shown.map(p=>{const neg=p.balance<0;const width=Math.max(1,Math.abs(p.balance)/max*48);const left=neg?50-width:50;return `<button class="forecast-row" style="width:100%;border-left:0;border-right:0;border-top:0;text-align:left;background:${p.idx===selected.idx?'#efeee7':'transparent'}" onclick="selectPeriod(${p.idx})"><span class="forecast-date">${esc(periodLabel(p))}</span><span class="bar-zone"><span class="bar ${neg?'negative':''}" style="left:${left}%;width:${width}%"></span></span><span class="forecast-amount mono ${neg?'negative-text':''}">${money(p.balance).replace('$','')}</span></button>`}).join('');
}
function visibleItems(p){const q=state.search.trim().toLowerCase();return p.items.filter(i=>{const hit=!q||[i.item,i.category,i.notes,i.type].some(v=>String(v||'').toLowerCase().includes(q));const f=state.filter==='all'||(state.filter==='paid'&&i.paid)||(state.filter==='unpaid'&&!i.paid)||(state.filter==='income'&&i.type==='Income')||(state.filter==='expense'&&i.type==='Expense');return hit&&f})}
function render(){
 if(!state.settings)return;const ps=periods(),p=currentPeriod(ps);if(state.selectedPeriod===null)state.selectedPeriod=p.idx;
 const grocery=p.items.filter(i=>i.type==='Expense'&&i.category.toLowerCase()===state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const bills=p.items.filter(i=>i.type==='Expense'&&i.category.toLowerCase()!==state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const remaining=p.items.filter(i=>i.type==='Expense'&&!i.paid&&i.category.toLowerCase()!==state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const items=visibleItems(p);
 $('#app').innerHTML=`<header class="topbar"><div class="toprow"><div><div class="eyebrow">${esc(state.settings.budget_name)}</div><h1 class="display">Payday Ledger</h1></div><button class="iconbtn" onclick="openData()">Data & setup</button></div><div class="period-title">${esc(periodLabel(p))}</div></header>
 <section class="summary"><div class="summary-card"><div class="summary-label">Bills</div><div class="summary-value mono">${money(bills)}</div></div><div class="summary-card"><div class="summary-label">Remaining bills</div><div class="summary-value mono">${money(remaining)}</div></div><div class="summary-card"><div class="summary-label">${esc(state.settings.grocery_category)}</div><div class="summary-value mono">${money(grocery)}</div></div><div class="summary-card expected"><div class="summary-label">Expected balance</div><div class="summary-value mono ${p.balance<0?'negative-text':''}">${money(p.balance)}</div></div></section>
 <div class="grid-wide"><section class="section"><div class="section-head"><div class="section-title">Future balance by fortnight</div></div><div class="card">${forecastHTML(ps,p)}</div></section>
 <section class="section"><div class="section-head"><div class="section-title">${p.idx===currentIdx()?'This fortnight':'Selected fortnight'}</div><div class="mono" style="font-size:12px;color:var(--muted)">${money(p.net)} net</div></div><div class="controls"><input id="search" class="search" placeholder="Search items" value="${esc(state.search)}" oninput="setSearch(this.value)"><select class="filter" onchange="setFilter(this.value)"><option value="all">All</option><option value="unpaid" ${state.filter==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${state.filter==='paid'?'selected':''}>Paid</option><option value="expense" ${state.filter==='expense'?'selected':''}>Expenses</option><option value="income" ${state.filter==='income'?'selected':''}>Income</option></select></div><div class="card">${items.length?items.map(i=>`<div class="item-row" onclick="editItem('${i.id}')"><button class="check ${i.paid?'paid':''}" onclick="event.stopPropagation();togglePaid('${i.id}',${i.paid})">${i.paid?'✓':''}</button><div style="min-width:0"><div class="item-name ${i.paid?'paid':''}">${esc(i.item)}</div><div class="item-meta">${esc(i.category)} · ${shortDate(i.date)}</div></div><div class="amount mono ${i.type==='Income'?'income':''}">${i.type==='Income'?'+':'−'}${money(i.amount)}</div></div>`).join(''):`<div class="empty">No matching items in this fortnight.</div>`}</div></section></div>`;
 $('#fab').classList.remove('hidden');renderModal();
}
window.selectPeriod=i=>{state.selectedPeriod=i;render()};window.setSearch=v=>{state.search=v;render()};window.setFilter=v=>{state.filter=v;render()};
window.openData=()=>{state.modal='data';state.tab='settings';renderModal()};window.closeModal=()=>{state.modal=null;state.editing=null;state.importParsed=null;renderModal()};
$('#fab').onclick=()=>{state.editing=null;state.modal='item';renderModal()};
window.editItem=id=>{state.editing=state.items.find(i=>i.id===id);state.modal='item';renderModal()};
window.togglePaid=async(id,paid)=>{const{error}=await sb.from('budget_items').update({paid:!paid}).eq('id',id);if(error)fail(error,'Could not update item');else toast(!paid?'Marked paid':'Marked unpaid')};
function renderModal(){const root=$('#modal');if(!state.modal){root.innerHTML='';return}if(state.modal==='item')root.innerHTML=itemSheet();else root.innerHTML=dataSheet()}
function itemSheet(){const i=state.editing||{date:currentPeriod(periods()).start,item:'',amount:'',type:'Expense',category:'Other',paid:false,notes:''};return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="display sheet-title">${state.editing?'Edit item':'Add item'}</div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveItem(event)"><div class="field"><label>Title</label><input id="fItem" required value="${esc(i.item)}"></div><div class="grid2"><div class="field"><label>Date</label><input id="fDate" type="date" required value="${i.date}"></div><div class="field"><label>Amount</label><input id="fAmount" type="number" step="0.01" min="0" required value="${i.amount}"></div></div><div class="grid2"><div class="field"><label>Type</label><select id="fType"><option ${i.type==='Expense'?'selected':''}>Expense</option><option ${i.type==='Income'?'selected':''}>Income</option></select></div><div class="field"><label>Category</label><input id="fCategory" required value="${esc(i.category)}"></div></div><div class="field"><label>Notes</label><textarea id="fNotes" rows="3">${esc(i.notes)}</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input id="fPaid" type="checkbox" ${i.paid?'checked':''}> Paid</label><div class="actions">${state.editing?'<button type="button" class="danger" onclick="deleteItem()">Delete</button>':''}<button type="submit" class="primary">Save item</button></div></form></div></div>`}
window.saveItem=async e=>{e.preventDefault();const row={date:$('#fDate').value,item:$('#fItem').value.trim(),amount:Math.abs(Number($('#fAmount').value)),type:$('#fType').value,category:$('#fCategory').value.trim()||'Other',paid:$('#fPaid').checked,notes:$('#fNotes').value.trim()};if(!row.item||!row.date||!Number.isFinite(row.amount))return;const q=state.editing?sb.from('budget_items').update(row).eq('id',state.editing.id):sb.from('budget_items').insert(row);const{error}=await q;if(error)fail(error,'Could not save item');else{closeModal();toast('Item saved')}};
window.deleteItem=async()=>{if(!confirm(`Delete “${state.editing.item}”?`))return;const{error}=await sb.from('budget_items').delete().eq('id',state.editing.id);if(error)fail(error,'Could not delete item');else{closeModal();toast('Item deleted')}};
function dataSheet(){return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="display sheet-title">Data & configuration</div><button class="close" onclick="closeModal()">✕</button></div><div class="tabs"><button class="tab ${state.tab==='settings'?'active':''}" onclick="switchTab('settings')">Configuration</button><button class="tab ${state.tab==='import'?'active':''}" onclick="switchTab('import')">Fresh start</button><button class="tab ${state.tab==='export'?'active':''}" onclick="switchTab('export')">Backup</button></div><div id="tabBody">${state.tab==='settings'?settingsTab():state.tab==='import'?importTab():exportTab()}</div></div></div>`}
window.switchTab=t=>{state.tab=t;state.importParsed=null;renderModal()};
function settingsTab(){const s=state.settings;return `<form onsubmit="saveSettingsForm(event)"><div class="field"><label>Budget name</label><input id="sName" value="${esc(s.budget_name)}"></div><div class="grid2"><div class="field"><label>Payday anchor</label><input id="sAnchor" type="date" value="${s.anchor}" required></div><div class="field"><label>Opening balance</label><input id="sBalance" type="number" step="0.01" value="${s.starting_balance}" required></div></div><div class="grid2"><div class="field"><label>Groceries category</label><input id="sGrocery" value="${esc(s.grocery_category)}" required></div><div class="field"><label>Future fortnights shown</label><input id="sPeriods" type="number" min="4" max="130" value="${s.forecast_periods}" required></div></div><p class="help">The anchor date determines all fortnight boundaries. Expected balances begin with the opening balance, then add income and subtract expenses in date order by fortnight.</p><button class="primary" style="width:100%">Save configuration</button></form>`}
window.saveSettingsForm=async e=>{e.preventDefault();const row={id:'global',budget_name:$('#sName').value.trim()||'CashForCoffee',anchor:$('#sAnchor').value,starting_balance:Number($('#sBalance').value)||0,grocery_category:$('#sGrocery').value.trim()||'Groceries',forecast_periods:Number($('#sPeriods').value)||26};const{error}=await sb.from('budget_settings').upsert(row);if(error)fail(error,'Could not save configuration');else toast('Configuration saved')};
function importTab(){return `<p class="help">Paste the table copied from Excel. Required columns are Date, Item, Amount and Type. Category is optional.</p><div class="field"><label>Paste CSV</label><textarea id="csv" rows="9" placeholder="Date,Item,Amount,Type,Category"></textarea></div><button class="secondary" style="width:100%" onclick="previewImport()">Validate and preview</button>${state.importParsed?importPreview():''}`}
window.previewImport=()=>{const txt=$('#csv').value.trim();const result=Papa.parse(txt,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase()});if(result.errors.length){alert(result.errors[0].message);return}const required=['date','item','amount','type'];const missing=required.filter(k=>!result.meta.fields.includes(k));if(missing.length){alert('Missing columns: '+missing.join(', '));return}const rows=[],bad=[];result.data.forEach((r,n)=>{const d=parseDate(r.date),a=Number(String(r.amount).replace(/[$,\s]/g,''));if(!d||!r.item||!Number.isFinite(a)){bad.push(n+2);return}rows.push({date:d,item:String(r.item).trim(),amount:Math.abs(a),type:String(r.type).trim().toLowerCase()==='income'?'Income':'Expense',category:String(r.category||'Other').trim()||'Other',paid:false,notes:''})});state.importParsed={rows,bad,min:rows.map(r=>r.date).sort()[0],max:rows.map(r=>r.date).sort().at(-1)};renderModal()};
function parseDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;const d=new Date(y,Number(m[2])-1,Number(m[1]));if(!isNaN(d))return isoLocal(d)}const d=new Date(s);return isNaN(d)?null:isoLocal(d)}
function importPreview(){const p=state.importParsed;return `<div class="preview"><strong>${p.rows.length.toLocaleString()} valid items</strong><br>${p.min?`${fullDate(p.min)} to ${fullDate(p.max)}`:''}${p.bad.length?`<br><span class="negative-text">Skipped rows: ${p.bad.join(', ')}</span>`:''}</div><div class="warning"><strong>Fresh start:</strong> this permanently deletes all current items, edits and paid tick-offs, then imports this new budget. Configuration is retained.</div><div class="field"><label>Type REPLACE MY BUDGET to confirm</label><input id="confirmReplace" autocomplete="off" oninput="checkReplace(this.value)"></div><button id="replaceBtn" class="danger" style="width:100%" disabled onclick="replaceAll()">Delete and replace all items</button>`}
window.checkReplace=v=>{$('#replaceBtn').disabled=v!=='REPLACE MY BUDGET'};
window.replaceAll=async()=>{if(!state.importParsed||state.busy)return;state.busy=true;$('#replaceBtn').disabled=true;$('#replaceBtn').textContent='Replacing…';const{data,error}=await sb.rpc('replace_budget_items',{new_items:state.importParsed.rows});state.busy=false;if(error){fail(error,'Fresh start failed');renderModal()}else{state.modal=null;state.importParsed=null;await loadAll();toast(`${data} items imported`)}};
function exportTab(){return `<p class="help">Download the current Supabase budget as a CSV backup before a fresh start or whenever you want an offline copy.</p><button class="primary" style="width:100%" onclick="exportCSV()">Download budget CSV</button><div style="height:10px"></div><button class="secondary" style="width:100%" onclick="exportSettings()">Download configuration JSON</button>`}
window.exportCSV=()=>{const rows=state.items.map(i=>({Date:i.date,Item:i.item,Amount:i.amount,Type:i.type,Category:i.category,Paid:i.paid?'Yes':'No',Notes:i.notes||''}));download(Papa.unparse(rows),'CashForCoffee-budget.csv','text/csv')};window.exportSettings=()=>download(JSON.stringify(state.settings,null,2),'CashForCoffee-settings.json','application/json');function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

sb.channel('cashforcoffee-live').on('postgres_changes',{event:'*',schema:'public',table:'budget_items'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'budget_settings'},loadAll).subscribe();
if(SUPABASE_URL.includes('YOUR_')){$('#app').innerHTML='<div class="loading"><strong>Supabase details are not configured yet.</strong><br><br>Paste your Project URL and anon key near the top of the script.</div>'}else loadAll();
</script>
</body>
</html>
