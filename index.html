<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#f7f4ec;--paper:#fffdf8;--ink:#18231d;--muted:#667168;--faint:#958f80;--line:#ded8ca;--line2:#eee9de;--green:#1f6a43;--green2:#2f8257;--green-soft:#edf5ef;--red:#a5352d;--red-soft:#fbeceb;--blue:#276b8a;--blue-soft:#eef6fa;--gold:#a98c50;--shadow:0 14px 35px rgba(32,52,40,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}button,input,select,textarea{font:inherit}.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.display{font-family:'Fraunces',serif}.hidden{display:none!important}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.topbar{padding:20px 18px 14px}.brandrow{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3d6f50,#17472f);color:white;font-size:25px;box-shadow:0 8px 18px rgba(31,106,67,.22)}h1{font-size:29px;line-height:1;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:5px}.menu{margin-left:auto;width:42px;height:42px;border:0;background:transparent;border-radius:12px;font-size:24px;color:var(--ink)}.period-card{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(32,52,40,.035)}.period-icon{width:36px;height:36px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;color:var(--green)}.period-label{font-size:11px;color:var(--muted)}.period-value{font-size:16px;font-weight:600;margin-top:2px}.period-arrow{margin-left:auto;color:var(--muted);font-size:22px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 16px 16px}.summary-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px;min-height:112px}.summary-card.income-card{background:linear-gradient(180deg,#fbfffc,var(--green-soft));border-color:#cfe2d4}.summary-card.expense-card{background:linear-gradient(180deg,#fffdfc,var(--red-soft));border-color:#ebcecb}.summary-card.remaining-card{background:linear-gradient(180deg,#fff,var(--blue-soft));border-color:#cfe0e8}.summary-card.expected-card{background:linear-gradient(180deg,#fff,var(--green-soft));border-color:#cfe2d4}.summary-label{text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;font-weight:600;display:flex;gap:7px;align-items:center}.summary-label.income{color:var(--green)}.summary-label.expense{color:var(--red)}.summary-label.remaining{color:var(--blue)}.summary-label.expected{color:var(--green)}.summary-value{font-size:22px;font-weight:600;margin-top:11px}.summary-note{font-size:11px;color:var(--muted);margin-top:8px}.section{margin:18px 16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-title{font-size:19px;font-weight:600}.add-inline{border:0;background:var(--green);color:white;border-radius:9px;padding:9px 13px;font-weight:600}.controls{display:flex;gap:8px;margin-bottom:10px}.search{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}.filter{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 8px;max-width:124px}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 3px 14px rgba(32,52,40,.035)}.item-row{display:grid;grid-template-columns:1fr auto 28px;gap:10px;align-items:center;padding:12px 13px;border-bottom:1px solid var(--line2)}.item-row:last-child{border-bottom:0}.item-row:active{background:var(--line2)}.check{width:23px;height:23px;border-radius:50%;border:1.5px solid #b5aa91;background:transparent;display:grid;place-items:center;color:white;padding:0}.check.paid{background:var(--green);border-color:var(--green)}.item-name{font-size:14px;font-weight:600}.item-name.paid{text-decoration:line-through;color:var(--faint)}.item-meta{font-size:10.5px;color:var(--faint);margin-top:3px}.pill{display:inline-block;padding:2px 7px;border-radius:6px;background:#f1eee4;color:#6d6557;margin-right:4px}.amount{text-align:right;font-size:13.5px;font-weight:600}.income-amount{color:var(--green)}.empty{text-align:center;padding:30px 18px;color:var(--muted)}.forecast-intro{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:11px}.forecast-row{display:grid;grid-template-columns:minmax(145px,1fr) minmax(55px,100px) auto 20px;gap:10px;align-items:center;padding:14px 13px;border:0;border-bottom:1px solid var(--line2);width:100%;text-align:left;background:transparent}.forecast-row:last-child{border-bottom:0}.forecast-row.selected{background:var(--green-soft)}.forecast-date{font-size:13px}.bar-zone{height:10px;background:#f1eee5;border-radius:8px;overflow:hidden}.bar{height:100%;min-width:3px;background:linear-gradient(90deg,#367c4f,#77a665);border-radius:8px}.bar.negative{background:var(--red)}.forecast-amount{text-align:right;font-size:13px;font-weight:600}.negative-text{color:var(--red)}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:76px;padding:8px 22px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,253,248,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:25}.nav-btn{border:0;background:transparent;color:#687069;font-size:11px;display:grid;place-items:center;gap:2px}.nav-icon{font-size:21px}.nav-btn.active{color:var(--green);font-weight:600}.primary,.secondary,.danger{border-radius:9px;padding:11px 13px;font-weight:600;border:1px solid transparent}.primary{background:var(--green);color:white}.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}.danger{background:var(--red);color:white}.primary:disabled,.danger:disabled{opacity:.35;cursor:not-allowed}.backdrop{position:fixed;inset:0;background:rgba(18,34,25,.54);z-index:50;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:94vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet-title{font-size:22px;font-weight:600}.close{border:0;background:none;font-size:20px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:16px}.tab{border:1px solid var(--line);background:transparent;border-radius:20px;padding:8px 12px;white-space:nowrap;font-size:12px}.tab.active{background:var(--green);border-color:var(--green);color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:12px}.field label{display:block;text-transform:uppercase;letter-spacing:.055em;font-size:10px;color:var(--faint);font-weight:600;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:white;border:1px solid #c8c3b4;border-radius:9px;padding:10px}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.help{font-size:12px;color:var(--muted);line-height:1.5}.warning{background:var(--red-soft);border:1px solid #ddb1a3;border-radius:10px;padding:11px;font-size:12px;color:#7c3525;margin:12px 0}.preview{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px;margin:12px 0;font-size:12px;line-height:1.6}.toast{position:fixed;z-index:100;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:white;border-radius:20px;padding:8px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:.96}.loading{padding:70px 20px;text-align:center;color:var(--muted)}
@media(min-width:620px){.summary{grid-template-columns:repeat(4,1fr)}.summary-card{min-height:126px}.item-row{grid-template-columns:1fr auto 30px}.app{padding-top:12px}.topbar{padding-top:24px}}
</style>
</head>
<body>
<div id="app" class="app"><div class="loading">Opening the ledger…</div></div>

<div id="modal"></div><div id="toast" class="toast"></div>
<script>
/* Paste these from Supabase: Project Settings > API */
const SUPABASE_URL = 'https://iadncppgdpdiucrhdbxw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Yc5UXSbMl1L_rdY6LWd81A_K36QaZ62';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DAY=86400000,FORTNIGHT=14*DAY;
let state={items:[],settings:null,selectedPeriod:null,view:'budget',search:'',filter:'all',modal:null,tab:'item',editing:null,importParsed:null,busy:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const shortDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fullDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function fail(error,context='Something went wrong'){console.error(error);alert(`${context}. ${error?.message||''}`.trim())}
function signed(i){return i.type==='Income'?Number(i.amount):-Number(i.amount)}
function isoLocal(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}

async function loadAll(){
 const [{data:items,error:e1},{data:settings,error:e2}]=await Promise.all([
  sb.from('budget_items').select('*').order('date').order('created_at'),
  sb.from('budget_settings').select('*').eq('id','global').single()
 ]);
 if(e1||e2){fail(e1||e2,'Could not load CashForCoffee');return}
 state.items=(items||[]).map(i=>({...i,amount:Number(i.amount)}));state.settings={...settings,starting_balance:Number(settings.starting_balance)};render();
}
function periods(){
 if(!state.settings)return[];const a=new Date(state.settings.anchor+'T00:00:00').getTime();
 const count=Number(state.settings.forecast_periods)||26;const nowIdx=Math.floor((Date.now()-a)/FORTNIGHT);const first=Math.min(nowIdx,0);const last=Math.max(nowIdx+count-1,0);
 const out=[];
 for(let idx=first;idx<=last;idx++){
  const start=a+idx*FORTNIGHT,end=start+FORTNIGHT;const its=state.items.filter(i=>{const t=new Date(i.date+'T00:00:00').getTime();return t>=start&&t<end});
  const income=its.filter(i=>i.type==='Income').reduce((s,i)=>s+Number(i.amount),0);const expenses=its.filter(i=>i.type!=='Income').reduce((s,i)=>s+Number(i.amount),0);const net=income-expenses;
  const balance=net+(idx===nowIdx?(Number(state.settings.starting_balance)||0):0);
  out.push({idx,start:isoLocal(new Date(start)),end:isoLocal(new Date(end-DAY)),items:its,income,expenses,net,balance});
 }
 return out;
}
function currentIdx(){const a=new Date(state.settings.anchor+'T00:00:00').getTime();return Math.floor((Date.now()-a)/FORTNIGHT)}
function currentPeriod(ps){const idx=state.selectedPeriod??currentIdx();return ps.find(p=>p.idx===idx)||ps[0]}
function periodLabel(p){return `${shortDate(p.start)} – ${fullDate(p.end)}`}
function forecastHTML(ps,selected){
 const shown=ps.filter(p=>p.idx>=currentIdx()).slice(0,Number(state.settings.forecast_periods)||26);
 const max=Math.max(1,...shown.map(p=>Math.abs(p.balance)));
 return shown.map(p=>{const neg=p.balance<0,w=Math.max(2,Math.round(Math.abs(p.balance)/max*100));return `<button class="forecast-row ${p.idx===selected.idx?'selected':''}" onclick="selectPeriod(${p.idx});setView('budget')"><span class="forecast-date">${esc(periodLabel(p))}</span><span class="bar-zone"><span class="bar ${neg?'negative':''}" style="display:block;width:${w}%"></span></span><span class="forecast-amount mono ${neg?'negative-text':''}">${money(p.balance)}</span><span>›</span></button>`}).join('');
}
function visibleItems(p){const q=state.search.trim().toLowerCase();return p.items.filter(i=>{const hit=!q||[i.item,i.category,i.notes,i.type].some(v=>String(v||'').toLowerCase().includes(q));const f=state.filter==='all'||(state.filter==='paid'&&i.paid)||(state.filter==='unpaid'&&!i.paid)||(state.filter==='income'&&i.type==='Income')||(state.filter==='expense'&&i.type==='Expense');return hit&&f})}
function render(){
 if(!state.settings)return;const ps=periods(),p=currentPeriod(ps);if(state.selectedPeriod===null)state.selectedPeriod=p.idx;
 const groceries=p.items.filter(i=>i.type==='Expense'&&i.category.toLowerCase()===state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const bills=p.items.filter(i=>i.type==='Expense'&&i.category.toLowerCase()!==state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const remaining=p.items.filter(i=>i.type==='Expense'&&!i.paid&&i.category.toLowerCase()!==state.settings.grocery_category.toLowerCase()).reduce((s,i)=>s+i.amount,0);
 const items=visibleItems(p);
 const budgetView=`<section class="summary"><div class="summary-card income-card"><div class="summary-label income">● Income</div><div class="summary-value mono">${money(p.income)}</div><div class="summary-note">This fortnight</div></div><div class="summary-card expense-card"><div class="summary-label expense">● Bills</div><div class="summary-value mono">${money(bills)}</div><div class="summary-note">Excluding groceries</div></div><div class="summary-card remaining-card"><div class="summary-label remaining">● Remaining bills</div><div class="summary-value mono">${money(remaining)}</div><div class="summary-note">Still unpaid</div></div><div class="summary-card expected-card"><div class="summary-label expected">● Expected balance</div><div class="summary-value mono ${p.balance<0?'negative-text':''}">${money(p.balance)}</div><div class="summary-note">End of fortnight</div></div></section><section class="section"><div class="section-head"><div><div class="section-title">Budget items</div><div class="forecast-intro">Groceries: <strong>${money(groceries)}</strong> · ${p.items.length} items</div></div><button class="add-inline" onclick="addItem()">＋ Add item</button></div><div class="controls"><input id="search" class="search" placeholder="Search items…" value="${esc(state.search)}" oninput="setSearch(this)"><select class="filter" onchange="setFilter(this.value)"><option value="all">All</option><option value="unpaid" ${state.filter==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${state.filter==='paid'?'selected':''}>Paid</option><option value="expense" ${state.filter==='expense'?'selected':''}>Expenses</option><option value="income" ${state.filter==='income'?'selected':''}>Income</option></select></div><div class="card" id="itemList">${items.length?items.map(i=>`<div class="item-row" data-search="${esc([i.item,i.category,i.notes,i.type].join(' ').toLowerCase())}" onclick="editItem('${i.id}')"><div><div class="item-name ${i.paid?'paid':''}">${esc(i.item)}</div><div class="item-meta"><span class="pill">${esc(i.category)}</span>${shortDate(i.date)}</div></div><div class="amount mono ${i.type==='Income'?'income-amount':''}">${i.type==='Income'?'+':'−'}${money(i.amount)}</div><button class="check ${i.paid?'paid':''}" onclick="event.stopPropagation();togglePaid('${i.id}',${i.paid})">${i.paid?'✓':''}</button></div>`).join(''):`<div class="empty">No matching items in this fortnight.</div>`}</div></section>`;
 const forecastView=`<section class="section"><div class="section-head"><div><div class="section-title">Future balance by fortnight</div><div class="forecast-intro">Expected balance at the end of each fortnight</div></div></div><div class="card">${forecastHTML(ps,p)}</div></section>`;
 $('#app').innerHTML=`<header class="topbar"><div class="brandrow"><div class="logo">☕</div><div><h1 class="display">CashForCoffee</h1><div class="subtitle">${esc(state.settings.budget_name||'Our household budget')}</div></div><button class="menu" onclick="openData()">☰</button></div><button class="period-card" style="width:100%;text-align:left" onclick="setView('forecast')"><span class="period-icon">▣</span><span><span class="period-label">${p.idx===currentIdx()?'Current fortnight':'Selected fortnight'}</span><span class="period-value">${esc(periodLabel(p))}</span></span><span class="period-arrow">›</span></button></header>${state.view==='budget'?budgetView:forecastView}<nav class="bottom-nav"><button class="nav-btn ${state.view==='budget'?'active':''}" onclick="setView('budget')"><span class="nav-icon">⌂</span><span>Dashboard</span></button><button class="nav-btn ${state.view==='forecast'?'active':''}" onclick="setView('forecast')"><span class="nav-icon">▥</span><span>Forecast</span></button><button class="nav-btn" onclick="openData()"><span class="nav-icon">⚙</span><span>Data & settings</span></button></nav>`;
 renderModal();
}
window.selectPeriod=i=>{state.selectedPeriod=i;render()};window.setView=v=>{state.view=v;render()};
window.setSearch=el=>{state.search=el.value;const q=state.search.trim().toLowerCase();document.querySelectorAll('#itemList .item-row').forEach(r=>r.style.display=!q||r.dataset.search.includes(q)?'grid':'none')};window.setFilter=v=>{state.filter=v;render()};
window.addItem=()=>{state.editing=null;state.modal='item';renderModal()};
window.openData=()=>{state.modal='data';state.tab='settings';renderModal()};window.closeModal=()=>{state.modal=null;state.editing=null;state.importParsed=null;renderModal()};

window.editItem=id=>{state.editing=state.items.find(i=>i.id===id);state.modal='item';renderModal()};
window.togglePaid=async(id,paid)=>{const{error}=await sb.from('budget_items').update({paid:!paid}).eq('id',id);if(error)fail(error,'Could not update item');else toast(!paid?'Marked paid':'Marked unpaid')};
function renderModal(){const root=$('#modal');if(!state.modal){root.innerHTML='';return}if(state.modal==='item')root.innerHTML=itemSheet();else root.innerHTML=dataSheet()}
function itemSheet(){const i=state.editing||{date:currentPeriod(periods()).start,item:'',amount:'',type:'Expense',category:'Other',paid:false,notes:''};return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="display sheet-title">${state.editing?'Edit item':'Add item'}</div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveItem(event)"><div class="field"><label>Title</label><input id="fItem" required value="${esc(i.item)}"></div><div class="grid2"><div class="field"><label>Date</label><input id="fDate" type="date" required value="${i.date}"></div><div class="field"><label>Amount</label><input id="fAmount" type="number" step="0.01" min="0" required value="${i.amount}"></div></div><div class="grid2"><div class="field"><label>Type</label><select id="fType"><option ${i.type==='Expense'?'selected':''}>Expense</option><option ${i.type==='Income'?'selected':''}>Income</option></select></div><div class="field"><label>Category</label><input id="fCategory" required value="${esc(i.category)}"></div></div><div class="field"><label>Notes</label><textarea id="fNotes" rows="3">${esc(i.notes)}</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input id="fPaid" type="checkbox" ${i.paid?'checked':''}> Paid</label><div class="actions">${state.editing?'<button type="button" class="danger" onclick="deleteItem()">Delete</button>':''}<button type="submit" class="primary">Save item</button></div></form></div></div>`}
window.saveItem=async e=>{e.preventDefault();const row={date:$('#fDate').value,item:$('#fItem').value.trim(),amount:Math.abs(Number($('#fAmount').value)),type:$('#fType').value,category:$('#fCategory').value.trim()||'Other',paid:$('#fPaid').checked,notes:$('#fNotes').value.trim()};if(!row.item||!row.date||!Number.isFinite(row.amount))return;const q=state.editing?sb.from('budget_items').update(row).eq('id',state.editing.id):sb.from('budget_items').insert(row);const{error}=await q;if(error)fail(error,'Could not save item');else{closeModal();toast('Item saved')}};
window.deleteItem=async()=>{if(!confirm(`Delete “${state.editing.item}”?`))return;const{error}=await sb.from('budget_items').delete().eq('id',state.editing.id);if(error)fail(error,'Could not delete item');else{closeModal();toast('Item deleted')}};
function dataSheet(){return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="display sheet-title">Data & configuration</div><button class="close" onclick="closeModal()">✕</button></div><div class="tabs"><button class="tab ${state.tab==='settings'?'active':''}" onclick="switchTab('settings')">Configuration</button><button class="tab ${state.tab==='import'?'active':''}" onclick="switchTab('import')">Fresh start</button><button class="tab ${state.tab==='export'?'active':''}" onclick="switchTab('export')">Backup</button></div><div id="tabBody">${state.tab==='settings'?settingsTab():state.tab==='import'?importTab():exportTab()}</div></div></div>`}
window.switchTab=t=>{state.tab=t;state.importParsed=null;renderModal()};
function settingsTab(){const s=state.settings;return `<form onsubmit="saveSettingsForm(event)"><div class="field"><label>Budget name</label><input id="sName" value="${esc(s.budget_name)}"></div><div class="grid2"><div class="field"><label>Payday anchor</label><input id="sAnchor" type="date" value="${s.anchor}" required></div><div class="field"><label>Opening balance</label><input id="sBalance" type="number" step="0.01" value="${s.starting_balance}" required></div></div><div class="grid2"><div class="field"><label>Groceries category</label><input id="sGrocery" value="${esc(s.grocery_category)}" required></div><div class="field"><label>Future fortnights shown</label><input id="sPeriods" type="number" min="4" max="130" value="${s.forecast_periods}" required></div></div><p class="help">The anchor date determines all fortnight boundaries. Each future balance is calculated independently for that fortnight. The opening balance is added only to the current fortnight.</p><button class="primary" style="width:100%">Save configuration</button></form>`}
window.saveSettingsForm=async e=>{e.preventDefault();const row={id:'global',budget_name:$('#sName').value.trim()||'CashForCoffee',anchor:$('#sAnchor').value,starting_balance:Number($('#sBalance').value)||0,grocery_category:$('#sGrocery').value.trim()||'Groceries',forecast_periods:Number($('#sPeriods').value)||26};const{error}=await sb.from('budget_settings').upsert(row);if(error)fail(error,'Could not save configuration');else toast('Configuration saved')};
function importTab(){return `<p class="help">Paste the table copied from Excel. Required columns are Date, Item, Amount and Type. Category is optional.</p><div class="field"><label>Paste CSV</label><textarea id="csv" rows="9" placeholder="Date,Item,Amount,Type,Category"></textarea></div><button class="secondary" style="width:100%" onclick="previewImport()">Validate and preview</button>${state.importParsed?importPreview():''}`}
window.previewImport=()=>{const txt=$('#csv').value.trim();const result=Papa.parse(txt,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase()});if(result.errors.length){alert(result.errors[0].message);return}const required=['date','item','amount','type'];const missing=required.filter(k=>!result.meta.fields.includes(k));if(missing.length){alert('Missing columns: '+missing.join(', '));return}const rows=[],bad=[];result.data.forEach((r,n)=>{const d=parseDate(r.date),a=Number(String(r.amount).replace(/[$,\s]/g,''));if(!d||!r.item||!Number.isFinite(a)){bad.push(n+2);return}rows.push({date:d,item:String(r.item).trim(),amount:Math.abs(a),type:String(r.type).trim().toLowerCase()==='income'?'Income':'Expense',category:String(r.category||'Other').trim()||'Other',paid:false,notes:''})});state.importParsed={rows,bad,min:rows.map(r=>r.date).sort()[0],max:rows.map(r=>r.date).sort().at(-1)};renderModal()};
function parseDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;const d=new Date(y,Number(m[2])-1,Number(m[1]));if(!isNaN(d))return isoLocal(d)}const d=new Date(s);return isNaN(d)?null:isoLocal(d)}
function importPreview(){const p=state.importParsed;return `<div class="preview"><strong>${p.rows.length.toLocaleString()} valid items</strong><br>${p.min?`${fullDate(p.min)} to ${fullDate(p.max)}`:''}${p.bad.length?`<br><span class="negative-text">Skipped rows: ${p.bad.join(', ')}</span>`:''}</div><div class="warning"><strong>Fresh start:</strong> this permanently deletes all current items, edits and paid tick-offs, then imports this new budget. Configuration is retained.</div><div class="field"><label>Type REPLACE MY BUDGET to confirm</label><input id="confirmReplace" autocomplete="off" oninput="checkReplace(this.value)"></div><button id="replaceBtn" class="danger" style="width:100%" disabled onclick="replaceAll()">Delete and replace all items</button>`}
window.checkReplace=v=>{$('#replaceBtn').disabled=v!=='REPLACE MY BUDGET'};
window.replaceAll=async()=>{if(!state.importParsed||state.busy)return;state.busy=true;$('#replaceBtn').disabled=true;$('#replaceBtn').textContent='Replacing…';const{data,error}=await sb.rpc('replace_budget_items',{new_items:state.importParsed.rows});state.busy=false;if(error){fail(error,'Fresh start failed');renderModal()}else{state.modal=null;state.importParsed=null;await loadAll();toast(`${data} items imported`)}};
function exportTab(){return `<p class="help">Download the current Supabase budget as a CSV backup before a fresh start or whenever you want an offline copy.</p><button class="primary" style="width:100%" onclick="exportCSV()">Download budget CSV</button><div style="height:10px"></div><button class="secondary" style="width:100%" onclick="exportSettings()">Download configuration JSON</button>`}
window.exportCSV=()=>{const rows=state.items.map(i=>({Date:i.date,Item:i.item,Amount:i.amount,Type:i.type,Category:i.category,Paid:i.paid?'Yes':'No',Notes:i.notes||''}));download(Papa.unparse(rows),'CashForCoffee-budget.csv','text/csv')};window.exportSettings=()=>download(JSON.stringify(state.settings,null,2),'CashForCoffee-settings.json','application/json');function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

sb.channel('cashforcoffee-live').on('postgres_changes',{event:'*',schema:'public',table:'budget_items'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'budget_settings'},loadAll).subscribe();
if(SUPABASE_URL.includes('YOUR_')){$('#app').innerHTML='<div class="loading"><strong>Supabase details are not configured yet.</strong><br><br>Paste your Project URL and anon key near the top of the script.</div>'}else loadAll();
</script>
</body>
</html>
