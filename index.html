const DAY_MS=86400000;
function dateToDay(v){const [y,m,d]=String(v).slice(0,10).split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/DAY_MS)}
function dayToISO(day){return new Date(day*DAY_MS).toISOString().slice(0,10)}
function todayDay(){const n=new Date();return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/DAY_MS)}
function shortDate(v){return new Date(v+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'})}
function fullDate(v){return new Date(v+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'})}
function periodLabel(p){return `${shortDate(p.start)} – ${fullDate(p.end)}`}
function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
function fail(error,context='Something went wrong'){console.error(error);state.sync='error';renderTopSync();alert(`${context}. ${error?.message||''}`.trim())}
function renderTopSync(){const el=document.querySelector('.sync-state');if(!el)return;el.className='sync-state'+(state.sync?' '+state.sync:'');el.textContent=state.sync==='saving'?'Saving…':state.sync==='error'?'Not saved':''}
function currentIdx(){return Math.floor((todayDay()-dateToDay(state.settings.anchor))/14)}
function chronologicalItemSort(a,b){
  const dateDiff=dateToDay(a.date)-dateToDay(b.date);
  if(dateDiff!==0)return dateDiff;
  const itemDiff=String(a.item||'').trim().localeCompare(String(b.item||'').trim(),'en-AU',{numeric:true,sensitivity:'base'});
  if(itemDiff!==0)return itemDiff;
  return String(a.id||'').localeCompare(String(b.id||''));
}
const itemSort=chronologicalItemSort;
const allItemSort=chronologicalItemSort;

function isMainIncome(i){return String(i.item||'').trim().toLowerCase()==='1. main income'}
function buildPeriods(){
  if(!state.settings)return[];
  const anchorDay=dateToDay(state.settings.anchor),nowIdx=currentIdx(),forecast=Number(state.settings.forecast_periods)||26;
  const itemIdxs=state.items.map(i=>Math.floor((dateToDay(i.date)-anchorDay)/14));
  const minItem=itemIdxs.length?Math.min(...itemIdxs):nowIdx,maxItem=itemIdxs.length?Math.max(...itemIdxs):nowIdx;
  const first=Math.min(nowIdx,minItem,0),last=Math.max(nowIdx+forecast-1,maxItem,0),out=[];
  for(let idx=first;idx<=last;idx++){
    const startDay=anchorDay+idx*14,endDay=startDay+13;
    const items=state.items.filter(i=>{const d=dateToDay(i.date);return d>=startDay&&d<=endDay}).sort(itemSort);
    const income=items.filter(i=>i.type==='Income').reduce((s,i)=>s+Number(i.amount),0);
    const expenses=items.filter(i=>i.type!=='Income').reduce((s,i)=>s+Number(i.amount),0);
    const net=income-expenses;
    const balance=net+(idx===nowIdx?(Number(state.settings.starting_balance)||0):0);
    out.push({idx,start:dayToISO(startDay),end:dayToISO(endDay),items,income,expenses,net,balance});
  }
  return out;
}
function selectedPeriod(ps){const idx=state.selectedPeriod??currentIdx();return ps.find(p=>p.idx===idx)||ps[0]}
function categoryClass(category){const c=String(category||'').trim().toLowerCase();if(c==='income')return 'pill-income';if(c==='savings & sinking funds')return 'pill-savings';if(c.startsWith('fixed essential'))return 'pill-fixed';if(c==='birthdays')return 'pill-birthdays';return ''}
function categories(){return [...new Set(state.items.map(i=>i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function groceryCategory(){return String(state.settings.grocery_category||'Groceries').toLowerCase()}
function isSavingsItem(i){return i.type==='Expense'&&String(i.category||'').toLowerCase().includes('saving')}
function periodStats(p){
  const grocery=p.items.filter(i=>i.type==='Expense'&&String(i.category).toLowerCase()===groceryCategory()).reduce((s,i)=>s+i.amount,0);
  const savings=p.items.filter(isSavingsItem).reduce((s,i)=>s+i.amount,0);
  const expenses=p.items.filter(i=>i.type==='Expense'&&!isSavingsItem(i)).reduce((s,i)=>s+i.amount,0);
  const remainingExpenses=p.items.filter(i=>i.type==='Expense'&&!i.paid&&!isSavingsItem(i)).reduce((s,i)=>s+i.amount,0);
  return{grocery,savings,expenses,remainingExpenses};
}

function authNeedsPassword(user){return !user?.user_metadata?.cashforcoffee_password_set||AUTH_LINK_TYPE==='invite'||AUTH_LINK_TYPE==='recovery'}
function showAuthMessage(kind,msg){const e=$('#authError'),s=$('#authSuccess');if(e)e.classList.remove('show');if(s)s.classList.remove('show');const target=kind==='error'?e:s;if(target){target.textContent=msg;target.classList.add('show')}}
function authShell(inner,title,sub){$('#app').innerHTML=`<main class="auth-page"><section class="auth-card"><div class="auth-brand"><div class="brandmark">☕</div><div><div class="auth-title">${esc(title)}</div><div class="auth-sub">${esc(sub)}</div></div></div><div id="authError" class="auth-error"></div><div id="authSuccess" class="auth-success"></div>${inner}</section></main>`;$('#modal').innerHTML=''}
function renderLogin(){state.authMode='login';authShell(`<form onsubmit="signIn(event)"><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" required></div><div class="auth-actions"><button id="signInBtn" class="primary" type="submit">Sign in</button><button class="auth-link" type="button" onclick="renderForgotPassword()">Forgot password?</button></div></form><div class="auth-note">Access is limited to invited household members.</div>`,'CashForCoffee','Sign in to your household budget')}
window.signIn=async e=>{e.preventDefault();const btn=$('#signInBtn');btn.disabled=true;btn.textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('#authEmail').value.trim(),password:$('#authPassword').value});if(error){showAuthMessage('error',error.message);btn.disabled=false;btn.textContent='Sign in'}};
window.renderForgotPassword=()=>{authShell(`<form onsubmit="sendPasswordReset(event)"><div class="field"><label>Email</label><input id="resetEmail" type="email" autocomplete="email" required></div><div class="auth-actions"><button id="resetBtn" class="primary" type="submit">Send reset link</button><button class="auth-link" type="button" onclick="renderLogin()">Back to sign in</button></div></form>`,'Reset password','We will email you a secure link to choose a new password')};
window.sendPasswordReset=async e=>{e.preventDefault();const btn=$('#resetBtn');btn.disabled=true;btn.textContent='Sending…';const redirectTo=location.origin+location.pathname;const{error}=await sb.auth.resetPasswordForEmail($('#resetEmail').value.trim(),{redirectTo});if(error){showAuthMessage('error',error.message);btn.disabled=false;btn.textContent='Send reset link'}else{showAuthMessage('success','Reset email sent. Check your inbox.');btn.textContent='Email sent'}};
function renderSetPassword(mode='invite'){state.authMode='password';const heading=mode==='recovery'?'Choose a new password':'Finish setting up';const sub=mode==='recovery'?'Create a new password for CashForCoffee':'Your invitation worked. Create the password you will use to sign in.';authShell(`<form onsubmit="setAccountPassword(event)"><div class="field"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="auth-actions"><button id="setPasswordBtn" class="primary" type="submit">Save password</button></div></form><div class="auth-note">Use at least 8 characters. Your signed-in session will remain on this device.</div>`,heading,sub)}
window.setAccountPassword=async e=>{e.preventDefault();const password=$('#newPassword').value,confirm=$('#confirmPassword').value;if(password!==confirm){showAuthMessage('error','The passwords do not match.');return}const btn=$('#setPasswordBtn');btn.disabled=true;btn.textContent='Saving…';const{data,error}=await sb.auth.updateUser({password,data:{cashforcoffee_password_set:true}});if(error){showAuthMessage('error',error.message);btn.disabled=false;btn.textContent='Save password';return}state.session={...(state.session||{}),user:data.user};AUTH_LINK_TYPE='';history.replaceState({},document.title,location.pathname);await startApp()};
window.signOut=async()=>{if(!confirm('Sign out of CashForCoffee on this device?'))return;await sb.auth.signOut()};
function startRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('cashforcoffee-live-auth').on('postgres_changes',{event:'*',schema:'public',table:'budget_items'},applyRealtime).on('postgres_changes',{event:'*',schema:'public',table:'budget_settings'},async()=>{const{data}=await sb.from('budget_settings').select('*').eq('id','global').single();if(data){state.settings={...data,starting_balance:Number(data.starting_balance)};render()}}).subscribe()}
async function stopRealtime(){if(realtimeChannel){await sb.removeChannel(realtimeChannel);realtimeChannel=null}}
async function startApp(){if(!state.session)return renderLogin();if(authNeedsPassword(state.session.user))return renderSetPassword(AUTH_LINK_TYPE==='recovery'?'recovery':'invite');startRealtime();if(!state.itemsLoaded)await loadAll();else render()}
async function initialiseAuth(){const{data:{session},error}=await sb.auth.getSession();if(error)console.error(error);state.session=session;if(session&&authNeedsPassword(session.user))renderSetPassword(AUTH_LINK_TYPE==='recovery'?'recovery':'invite');else if(session)await startApp();else renderLogin()}
async function loadAll(){
  const[{data:items,error:e1},{data:settings,error:e2}]=await Promise.all([
    sb.from('budget_items').select('*').order('date').order('created_at'),
    sb.from('budget_settings').select('*').eq('id','global').single()
  ]);
  if(e1||e2){fail(e1||e2,'Could not load CashForCoffee');return}
  state.items=(items||[]).map(i=>({...i,amount:Number(i.amount)}));
  state.settings={...settings,starting_balance:Number(settings.starting_balance)};
  state.itemsLoaded=true;
  render();
}
function summaryCards(p){const s=periodStats(p);return `<section class="summary">
  <div class="summary-card income"><div class="summary-label">↥ Income</div><div class="summary-value mono">${money(p.income)}</div><div class="summary-note">This fortnight</div></div>
  <div class="summary-card expense"><div class="summary-label">↧ Expenses</div><div class="summary-value mono">${money(s.expenses)}</div><div class="summary-note">Excluding savings</div></div>
  <div class="summary-card remaining"><div class="summary-label">＝ Remaining expenses</div><div class="summary-value mono">${money(s.remainingExpenses)}</div><div class="summary-note">Still unpaid</div></div>
  <div class="summary-card expected"><div class="summary-label">▣ Expected balance</div><div class="summary-value mono ${p.balance<0?'negative':''}">${money(p.balance)}</div><div class="summary-note">End of fortnight</div></div>
  <div class="summary-card savings"><div class="summary-label">◆ Savings</div><div class="summary-value mono">${money(s.savings)}</div><div class="summary-note">Savings & sinking funds</div></div>
</section>`}
function categoryOptions(selected){return `<option value="all">All categories</option>`+categories().map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('')}
function periodVisibleItems(p){const q=state.search.trim().toLowerCase();return p.items.filter(i=>{const hit=!q||[i.item,i.category,i.notes,i.type,i.date].some(v=>String(v||'').toLowerCase().includes(q));const f=state.filter==='all'||(state.filter==='paid'&&i.paid)||(state.filter==='unpaid'&&!i.paid);const c=state.category==='all'||i.category===state.category;const t=state.type==='all'||i.type===state.type;return hit&&f&&c&&t}).sort(itemSort)}
function tableHTML(items,mode='period'){
  const displayItems=mode==='all'?[...items]:[...items].sort(itemSort);
  return `<div class="table-wrap"><table class="budget-table"><thead><tr><th>Date</th><th>Item</th><th>Category</th><th>Type</th><th>Amount</th><th>Paid</th><th></th></tr></thead><tbody>
  ${displayItems.length?displayItems.map((i,index)=>`<tr class="${mode==='all'&&isMainIncome(i)&&index>0?'pay-period-start':''}" data-search="${esc([i.item,i.category,i.notes,i.type,i.date].join(' ').toLowerCase())}" onclick="editItem('${i.id}')">
    <td data-label="Date">${fullDate(i.date)}</td><td data-label="Item"><span class="item-main ${i.paid?'paid':''}">${esc(i.item)}</span>${i.notes?`<div style="font-size:10px;color:var(--muted);margin-top:3px">${esc(i.notes)}</div>`:''}</td>

    <td data-label="Amount" class="amount ${i.type==='Income'?'income':'expense'} mono">${i.type==='Income'?'+':'-'}${money(i.amount)}</td>

    <td data-label="More"><button class="more" onclick="event.stopPropagation();editItem('${i.id}')">⋯</button></td></tr>`).join(''):`<tr><td colspan="7" style="padding:34px;text-align:center;color:var(--muted)">No matching items.</td></tr>`}
  </tbody></table></div><div class="table-foot"><span>${displayItems.length.toLocaleString()} item${displayItems.length===1?'':'s'}</span>${mode==='period'?`<button class="ghost" onclick="setView('all')">View everything →</button>`:''}</div>`
}
function forecastHTML(ps,p,limit=12){const shown=ps.filter(x=>x.idx>=currentIdx()).slice(0,limit),max=Math.max(1,...shown.map(x=>Math.abs(x.balance)));return shown.map(x=>`<button class="forecast-row ${x.idx===p.idx?'selected':''}" onclick="selectPeriod(${x.idx});setView('dashboard')"><span class="forecast-date">${esc(periodLabel(x))}</span><span class="bar-zone"><span class="bar ${x.balance<0?'negative':''}" style="width:${Math.max(2,Math.round(Math.abs(x.balance)/max*100))}%"></span></span><span class="forecast-amount mono ${x.balance<0?'negative':''}">${money(x.balance)}</span><span>›</span></button>`).join('')}
function dashboardView(ps,p){const items=periodVisibleItems(p);return `<div class="dashboard-grid"><div class="left-col">${summaryCards(p)}<section class="panel"><div class="panel-head"><div><div class="panel-title">Budget items</div><div class="panel-sub">${p.items.filter(i=>!i.paid).length} remaining of ${p.items.length} items this fortnight</div></div><div class="panel-spacer"></div><button class="primary" onclick="addItem()">＋ Add item</button></div><div class="toolbar"><input class="search" placeholder="Search items…" value="${esc(state.search)}" oninput="setPeriodSearch(this.value)"><select class="select category-filter" onchange="setPeriodCategory(this.value)">${categoryOptions(state.category)}</select><select class="select type-filter" onchange="setPeriodType(this.value)"><option value="all">All types</option><option value="Income" ${state.type==='Income'?'selected':''}>Income</option><option value="Expense" ${state.type==='Expense'?'selected':''}>Expense</option></select><select class="select" onchange="setPeriodFilter(this.value)"><option value="all">All</option><option value="unpaid" ${state.filter==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${state.filter==='paid'?'selected':''}>Paid</option></select></div>${tableHTML(items)}</section></div><aside class="right-col"><section class="panel forecast-panel"><div class="panel-head"><div><div class="panel-title">Fortnight forecast</div><div class="panel-sub">Expected balance at the end of each fortnight</div></div></div>${forecastHTML(ps,p,12)}<div class="forecast-foot"><button class="secondary" style="width:100%" onclick="setView('forecast')">View full forecast</button></div></section></aside></div>`}
function allItems(){const q=state.allSearch.trim().toLowerCase();return state.items.filter(i=>{const hit=!q||[i.item,i.category,i.notes,i.type,i.date].some(v=>String(v||'').toLowerCase().includes(q));const c=state.allCategory==='all'||i.category===state.allCategory;const t=state.allType==='all'||i.type===state.allType;const p=state.allPaid==='all'||(state.allPaid==='paid'&&i.paid)||(state.allPaid==='unpaid'&&!i.paid);return hit&&c&&t&&p}).map(i=>i).sort(allItemSort)}
function allView(){const items=allItems(),income=state.items.filter(i=>i.type==='Income').reduce((s,i)=>s+i.amount,0),expenses=state.items.filter(i=>i.type!=='Income').reduce((s,i)=>s+i.amount,0),unpaid=state.items.filter(i=>i.type!=='Income'&&!i.paid).reduce((s,i)=>s+i.amount,0);return `<div class="all-grid"><section class="all-summary"><div class="mini-card"><div class="label">All items</div><div class="value mono">${state.items.length.toLocaleString()}</div></div><div class="mini-card"><div class="label">Total income</div><div class="value mono" style="color:var(--green)">${money(income)}</div></div><div class="mini-card"><div class="label">Total expenses</div><div class="value mono" style="color:var(--red)">${money(expenses)}</div></div><div class="mini-card"><div class="label">Unpaid expenses</div><div class="value mono" style="color:var(--blue)">${money(unpaid)}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Everything</div><div class="panel-sub">Every imported and manually added budget item</div></div><div class="panel-spacer"></div><button class="primary" onclick="addItem()">＋ Add item</button></div><div class="toolbar"><input class="search" placeholder="Search all items…" value="${esc(state.allSearch)}" oninput="setAllSearch(this.value)"><select class="select" onchange="setAllCategory(this.value)">${categoryOptions(state.allCategory)}</select><select class="select" onchange="setAllType(this.value)"><option value="all">All types</option><option value="Income" ${state.allType==='Income'?'selected':''}>Income</option><option value="Expense" ${state.allType==='Expense'?'selected':''}>Expense</option></select><select class="select" onchange="setAllPaid(this.value)"><option value="all">All</option><option value="unpaid" ${state.allPaid==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${state.allPaid==='paid'?'selected':''}>Paid</option></select></div>${tableHTML(items,'all')}</section></div>`}
function forecastView(ps,p){return `<div class="forecast-page"><section class="panel"><div class="panel-head"><div><div class="panel-title">Full fortnight forecast</div><div class="panel-sub">Expected balance for each pay fortnight. Tap a period to open it.</div></div></div>${forecastHTML(ps,p,Number(state.settings.forecast_periods)||26)}</section></div>`}
function cashflowView(){return `<div class="forecast-page"><section class="cashflow-card"><div class="cashflow-head"><div><div class="cashflow-title">Cumulative cash flow</div><div class="cashflow-sub">Running balance across future pay fortnights</div></div><div class="cashflow-legend"><span><i class="legend-dot pos"></i>Positive</span><span><i class="legend-dot neg"></i>Below zero</span></div></div><div class="cashflow-canvas-wrap"><canvas id="cashflowChart"></canvas></div><div class="zero-note">Each point carries the previous fortnight forward, so the line shows your projected running position.</div></section></div>`}
function renderCashflowChart(ps){
  if(cashflowChart){cashflowChart.destroy();cashflowChart=null}

  if(!canvas||typeof Chart==='undefined')return;

}

  return `<div class="balance-card"><div class="kicker">What's up next</div>${items.length?`<div class="up-next-list">${items.map(i=>`<div class="up-next-item"><div><div class="up-next-name">${esc(i.item)}</div><div class="up-next-date">${fullDate(i.date)}</div></div><div class="up-next-amount mono">${money(i.amount)}</div></div>`).join('')}</div>`:`<div class="hint" style="margin-top:8px">No upcoming unpaid expenses.</div>`}</div>`;
}
function pageMeta(){if(state.view==='all')return['All items','Search and manage the full budget'];if(state.view==='forecast')return['Forecast','Future balance by pay fortnight'];if(state.view==='cashflow')return['Cash flow','Cumulative running balance'];return['CashForCoffee',state.settings?.budget_name||'Our household budget']}
function render(){if(!state.settings)return;document.body.classList.toggle('dashboard-lock',state.view==='dashboard');document.body.classList.toggle('all-lock',state.view==='all');const ps=buildPeriods(),p=selectedPeriod(ps);if(state.selectedPeriod===null)state.selectedPeriod=p.idx;const [title,sub]=pageMeta();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">☕</div><div><div class="brandname">CashForCoffee</div><div class="brandsub">Our household budget</div></div></div><nav class="nav-group"><button class="nav-btn ${state.view==='dashboard'?'active':''}" onclick="setView('dashboard')"><span class="nav-icon">⌂</span>Dashboard</button><button class="nav-btn ${state.view==='all'?'active':''}" onclick="setView('all')"><span class="nav-icon">☷</span>All items</button><button class="nav-btn ${state.view==='forecast'?'active':''}" onclick="setView('forecast')"><span class="nav-icon">▥</span>Forecast</button><button class="nav-btn ${state.view==='cashflow'?'active':''}" onclick="setView('cashflow')"><span class="nav-icon">⌁</span>Cash flow</button><button class="nav-btn" onclick="openData()"><span class="nav-icon">⚙</span>Manage</button></nav><div class="side-label">Quick actions</div><button class="quick-btn" onclick="addItem()">⊕ Add item</button><button class="quick-btn" onclick="openData('import')">⇩ Import / Fresh start</button><button class="quick-btn" onclick="openData('export')">⇧ Export / Backup</button><button class="quick-btn" onclick="markPeriodPaid()">✓ Mark period paid</button><div class="side-spacer"></div></aside><main class="main"><header class="topbar"><div class="mobile-brand"><div class="brandmark">☕</div><div><div class="brandname">CashForCoffee</div><div class="brandsub">${esc(sub)}</div></div></div><div class="page-heading"><div class="page-title">${esc(title)}</div><div class="page-sub">${esc(sub)}</div></div><div class="top-spacer"></div><button class="period-picker" onclick="setView('forecast')"><span class="icon">📅</span><span><span class="label">${p.idx===currentIdx()?'Current':'Selected'} fortnight</span><span class="value">${esc(periodLabel(p))}</span></span><span style="margin-left:auto;color:var(--faint)">⌄</span></button><div class="sync-state"></div></header><div class="content">${state.view==='dashboard'?dashboardView(ps,p):state.view==='all'?allView():state.view==='forecast'?forecastView(ps,p):cashflowView()}</div></main></div><button class="fab" onclick="addItem()">＋</button><nav class="mobile-nav"><button class="${state.view==='dashboard'?'active':''}" onclick="setView('dashboard')"><span>⌂</span><span>Dashboard</span></button><button class="${state.view==='all'?'active':''}" onclick="setView('all')"><span>☷</span><span>All items</span></button><button class="${state.view==='forecast'?'active':''}" onclick="setView('forecast')"><span>▥</span><span>Forecast</span></button><button class="${state.view==='cashflow'?'active':''}" onclick="setView('cashflow')"><span>⌁</span><span>Cash flow</span></button><button onclick="openData()"><span>⚙</span><span>Manage</span></button></nav>`;renderTopSync();renderModal();if(state.view==='cashflow')requestAnimationFrame(()=>renderCashflowChart(ps))}
window.setView=v=>{if(v!=='cashflow'&&cashflowChart){cashflowChart.destroy();cashflowChart=null}state.view=v;render()};window.selectPeriod=i=>{state.selectedPeriod=i;render()};
function filterVisibleTable(v){const q=String(v||'').trim().toLowerCase();let shown=0;document.querySelectorAll('.budget-table tbody tr[data-search]').forEach(r=>{const visible=!q||r.dataset.search.includes(q);r.classList.toggle('search-hidden',!visible);if(visible)shown++});const foot=document.querySelector('.table-foot span');if(foot)foot.textContent=`${shown.toLocaleString()} item${shown===1?'':'s'}`}
window.setPeriodSearch=v=>{state.search=v;filterVisibleTable(v)};window.setPeriodFilter=v=>{state.filter=v;render()};window.setPeriodCategory=v=>{state.category=v;render()};window.setPeriodType=v=>{state.type=v;render()};
window.setAllSearch=v=>{state.allSearch=v;filterVisibleTable(v)};window.setAllCategory=v=>{state.allCategory=v;render()};window.setAllType=v=>{state.allType=v;render()};window.setAllPaid=v=>{state.allPaid=v;render()};
function tableScrollTop(){const el=document.querySelector('.table-wrap');return el?el.scrollTop:0}function restoreTableScroll(y){requestAnimationFrame(()=>{const el=document.querySelector('.table-wrap');if(el)el.scrollTop=y})}
window.togglePaid=async(id,paid)=>{const item=state.items.find(i=>i.id===id);if(!item||state.pending.has(id))return;const scrollY=tableScrollTop();state.pending.add(id);item.paid=!paid;state.sync='saving';render();restoreTableScroll(scrollY);const{error}=await sb.from('budget_items').update({paid:!paid}).eq('id',id);state.pending.delete(id);if(error){const rollbackY=tableScrollTop();item.paid=paid;state.sync='error';render();restoreTableScroll(rollbackY);fail(error,'Could not update item')}else{state.sync='';renderTopSync()}};
window.markPeriodPaid=async()=>{const p=selectedPeriod(buildPeriods()),targets=p.items.filter(i=>i.type==='Expense'&&!i.paid);if(!targets.length){toast('Nothing left to mark paid');return}targets.forEach(i=>i.paid=true);state.sync='saving';render();const ids=targets.map(i=>i.id);const{error}=await sb.from('budget_items').update({paid:true}).in('id',ids);if(error){targets.forEach(i=>i.paid=false);fail(error,'Could not mark period paid');render()}else{state.sync='';renderTopSync();toast(`${targets.length} items marked paid`)}};
window.addItem=()=>{state.editing=null;state.modal='item';renderModal()};window.editItem=id=>{state.editing=state.items.find(i=>i.id===id);state.modal='item';renderModal()};window.openData=t=>{state.modal='data';state.tab=t||'settings';renderModal()};window.closeModal=()=>{state.modal=null;state.editing=null;state.importParsed=null;renderModal()};
function renderModal(){const root=$('#modal');if(!root)return;if(!state.modal){root.innerHTML='';return}root.innerHTML=state.modal==='item'?itemSheet():dataSheet()}
function itemSheet(){const p=selectedPeriod(buildPeriods()),i=state.editing||{date:p.start,item:'',amount:'',type:'Expense',category:'Other',paid:false,notes:''};return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">${state.editing?'Edit item':'Add item'}</div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveItem(event)"><div class="field"><label>Title</label><input id="fItem" required value="${esc(i.item)}"></div><div class="grid2"><div class="field"><label>Date</label><input id="fDate" type="date" required value="${i.date}"></div><div class="field"><label>Amount ($)</label><input id="fAmount" type="number" step="0.01" min="0" required value="${i.amount}"></div></div><div class="grid2"><div class="field"><label>Type</label><select id="fType"><option ${i.type==='Expense'?'selected':''}>Expense</option><option ${i.type==='Income'?'selected':''}>Income</option></select></div><div class="field"><label>Category</label><input id="fCategory" value="${esc(i.category)}" required></div></div><div class="field"><label>Notes</label><textarea id="fNotes" rows="3">${esc(i.notes)}</textarea></div><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input id="fPaid" type="checkbox" ${i.paid?'checked':''}> Mark as paid</label><div class="actions">${state.editing?'<button type="button" class="danger" onclick="deleteItem()">Delete</button>':''}<button class="primary" type="submit">Save item</button></div></form></div></div>`}
window.saveItem=async e=>{e.preventDefault();const row={date:$('#fDate').value,item:$('#fItem').value.trim(),amount:Math.abs(Number($('#fAmount').value)),type:$('#fType').value,category:$('#fCategory').value.trim()||'Other',paid:$('#fPaid').checked,notes:$('#fNotes').value.trim()};if(!row.item||!row.date||!Number.isFinite(row.amount))return;state.sync='saving';const{data,error}=state.editing?await sb.from('budget_items').update(row).eq('id',state.editing.id).select().single():await sb.from('budget_items').insert(row).select().single();if(error){fail(error,'Could not save item');return}if(state.editing){const idx=state.items.findIndex(i=>i.id===state.editing.id);if(idx>=0)state.items[idx]={...state.items[idx],...data,amount:Number(data.amount)}}else state.items.push({...data,amount:Number(data.amount)});state.sync='';closeModal();render();toast('Item saved')};
window.deleteItem=async()=>{if(!confirm(`Delete “${state.editing.item}”?`))return;const id=state.editing.id;const backup=state.items.find(i=>i.id===id);state.items=state.items.filter(i=>i.id!==id);closeModal();render();const{error}=await sb.from('budget_items').delete().eq('id',id);if(error){state.items.push(backup);render();fail(error,'Could not delete item')}else toast('Item deleted')};
function dataSheet(){return `<div class="backdrop" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div class="sheet-title">Manage</div><button class="close" onclick="closeModal()">✕</button></div><div class="tabs"><button class="tab ${state.tab==='settings'?'active':''}" onclick="switchTab('settings')">Configuration</button><button class="tab ${state.tab==='import'?'active':''}" onclick="switchTab('import')">Fresh start</button><button class="tab ${state.tab==='export'?'active':''}" onclick="switchTab('export')">Backup</button></div>${state.tab==='settings'?settingsTab():state.tab==='import'?importTab():exportTab()}<div class="account-strip"><div class="account-email">Signed in as ${esc(state.session?.user?.email||'')}</div><button class="secondary" type="button" onclick="signOut()">Sign out</button></div></div></div>`}
window.switchTab=t=>{state.tab=t;state.importParsed=null;renderModal()};
function settingsTab(){const s=state.settings;return `<form onsubmit="saveSettingsForm(event)"><div class="field"><label>Budget name</label><input id="sName" value="${esc(s.budget_name)}"></div><div class="grid2"><div class="field"><label>Fortnight anchor date</label><input id="sAnchor" type="date" value="${s.anchor}" required></div><div class="field"><label>Opening balance</label><input id="sBalance" type="number" step="0.01" value="${s.starting_balance}" required></div></div><div class="grid2"><div class="field"><label>Grocery category</label><input id="sGrocery" value="${esc(s.grocery_category)}" required></div><div class="field"><label>Forecast periods</label><input id="sPeriods" type="number" min="4" max="130" value="${s.forecast_periods}" required></div></div><p class="help">The anchor date must be the first day of one genuine pay fortnight. Periods are now calculated using calendar dates in UTC, avoiding daylight-saving drift and duplicated pay-period boundaries.</p><button class="primary" style="width:100%">Save settings</button></form>`}
window.saveSettingsForm=async e=>{e.preventDefault();const row={id:'global',budget_name:$('#sName').value.trim()||'CashForCoffee',anchor:$('#sAnchor').value,starting_balance:Number($('#sBalance').value)||0,grocery_category:$('#sGrocery').value.trim()||'Groceries',forecast_periods:Number($('#sPeriods').value)||26};const{data,error}=await sb.from('budget_settings').upsert(row).select().single();if(error){fail(error,'Could not save configuration');return}state.settings={...data,starting_balance:Number(data.starting_balance)};state.selectedPeriod=null;closeModal();render();toast('Configuration saved')};
function importTab(){return `<p class="help">Paste CSV with columns Date, Item, Amount, Type and Category. This replaces all current budget items after validation.</p><div class="field"><label>Paste CSV</label><textarea id="csv" rows="7" placeholder="Date,Item,Amount,Type,Category"></textarea></div><button class="secondary" style="width:100%" onclick="previewImport()">Validate and preview</button>${state.importParsed?importPreview():''}`}
window.previewImport=()=>{const txt=$('#csv').value.trim(),result=Papa.parse(txt,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase()});if(result.errors.length){alert(result.errors[0].message);return}const req=['date','item','amount','type'],missing=req.filter(k=>!result.meta.fields.includes(k));if(missing.length){alert('Missing columns: '+missing.join(', '));return}const rows=[],bad=[];result.data.forEach((r,n)=>{const d=parseDate(r.date),a=Number(String(r.amount).replace(/[$,\s]/g,''));if(!d||!r.item||!Number.isFinite(a)){bad.push(n+2);return}rows.push({date:d,item:String(r.item).trim(),amount:Math.abs(a),type:String(r.type).trim().toLowerCase()==='income'?'Income':'Expense',category:String(r.category||'Other').trim()||'Other',paid:false,notes:''})});state.importParsed={rows,bad,min:rows.map(r=>r.date).sort()[0],max:rows.map(r=>r.date).sort().at(-1)};renderModal()};
function parseDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);if(m){let y=Number(m[3]);if(y<100)y+=2000;const d=new Date(Date.UTC(y,Number(m[2])-1,Number(m[1])));return d.toISOString().slice(0,10)}const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10)}
function importPreview(){const p=state.importParsed;return `<div class="preview"><strong>${p.rows.length.toLocaleString()} valid items ready</strong><br>${p.min?`${fullDate(p.min)} to ${fullDate(p.max)}`:''}${p.bad.length?`<br><span class="negative">Skipped rows: ${p.bad.join(', ')}</span>`:''}</div><div class="warning"><strong>Fresh start:</strong> this permanently replaces all existing budget items, edits and paid statuses.</div><div class="field"><label>Type REPLACE MY BUDGET to confirm</label><input id="confirmReplace" oninput="checkReplace(this.value)"></div><button id="replaceBtn" class="danger" style="width:100%" disabled onclick="replaceAll()">Delete and replace all items</button>`}
window.checkReplace=v=>{$('#replaceBtn').disabled=v!=='REPLACE MY BUDGET'};window.replaceAll=async()=>{if(!state.importParsed||state.busy)return;state.busy=true;$('#replaceBtn').disabled=true;$('#replaceBtn').textContent='Replacing…';const{data,error}=await sb.rpc('replace_budget_items',{new_items:state.importParsed.rows});state.busy=false;if(error){fail(error,'Fresh start failed');renderModal()}else{state.modal=null;state.importParsed=null;await loadAll();toast(`${data} items imported`)}};
function exportTab(){return `<p class="help">Download a full CSV backup of the live Supabase budget, including paid status and notes.</p><button class="primary" style="width:100%" onclick="exportCSV()">Download budget CSV</button><div style="height:10px"></div><button class="secondary" style="width:100%" onclick="exportSettings()">Download settings JSON</button>`}
window.exportCSV=()=>{const rows=[...state.items].sort(itemSort).map(i=>({Date:i.date,Item:i.item,Amount:i.amount,Type:i.type,Category:i.category,Paid:i.paid?'Yes':'No',Notes:i.notes||''}));download(Papa.unparse(rows),'CashForCoffee-budget.csv','text/csv')};window.exportSettings=()=>download(JSON.stringify(state.settings,null,2),'CashForCoffee-settings.json','application/json');function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function applyRealtime(payload){const row=payload.new||payload.old;if(!row)return;let changed=false;const scrollY=tableScrollTop();if(payload.eventType==='INSERT'){if(!state.items.some(i=>i.id===row.id)){state.items.push({...row,amount:Number(row.amount)});changed=true}}else if(payload.eventType==='UPDATE'){const idx=state.items.findIndex(i=>i.id===row.id);if(idx>=0&&!state.pending.has(row.id)){state.items[idx]={...state.items[idx],...row,amount:Number(row.amount)};changed=true}else if(idx<0){state.items.push({...row,amount:Number(row.amount)});changed=true}}else if(payload.eventType==='DELETE'){const before=state.items.length;state.items=state.items.filter(i=>i.id!==row.id);changed=state.items.length!==before}if(changed){render();restoreTableScroll(scrollY)}}
sb.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{state.session=session;if(event==='SIGNED_OUT'){state.items=[];state.settings=null;state.itemsLoaded=false;await stopRealtime();renderLogin();return}if(event==='PASSWORD_RECOVERY'){renderSetPassword('recovery');return}if(event==='SIGNED_IN'&&session){await startApp()}if(event==='USER_UPDATED'&&session&&!authNeedsPassword(session.user)){await startApp()}},0)});
initialiseAuth();
</script>
</body>
</html>
